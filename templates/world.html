<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Temple of Thirukkural - 2D World</title>

    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

    <!-- HOME BUTTON -->
    <button
        onclick="window.location.href='/'"
        style="
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 9999;
            padding: 12px 24px;
            background: #1b120b;
            color: #f5d78e;
            border: 2px solid #d9a441;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        "
    >
        🏠 HOME
    </button>


    <div id="game-wrapper">

        <canvas id="game-canvas"></canvas>

        <div id="controls-hint">
            WASD / Arrow Keys — Move
        </div>

    </div>


    <script src="/static/game-world.js"></script>

</body>

</html>
